# Agent Runtime lint rules on top of the workspace configuration. Only this component may
# import an agent SDK (root pyproject.toml import contracts), and it never starts a
# process or reaches the network itself: the SDK does, with the environment built here.

extend = "../pyproject.toml"

[lint]
extend-select = ["TID251"]

[lint.flake8-tidy-imports.banned-api]
"socket".msg = "The SDK is the only thing that talks to the network."
"http.client".msg = "The SDK is the only thing that talks to the network."
"urllib.request".msg = "The SDK is the only thing that talks to the network."
"asyncio.create_subprocess_exec".msg = "The SDK starts the CLI runtime; nothing else may."
"asyncio.create_subprocess_shell".msg = "The SDK starts the CLI runtime; nothing else may."
"os.system".msg = "The SDK starts the CLI runtime; nothing else may start processes."
"os.execv".msg = "The SDK starts the CLI runtime; nothing else may start processes."
"os.posix_spawn".msg = "The SDK starts the CLI runtime; nothing else may start processes."
"ctypes".msg = "No native code loading."
"multiprocessing".msg = "The SDK starts the CLI runtime; nothing else may start processes."
"subprocess".msg = "The SDK starts the CLI runtime; nothing else may start processes."
"importlib.import_module".msg = "Dynamic imports would bypass the import contracts."
