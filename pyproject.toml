# Workspace root (ADR 0003). It is not a package itself: each component is a
# member with its own pyproject.toml, and shared tool configuration lives here.

[tool.uv]
required-version = ">=0.12.15,<0.13"

[tool.uv.workspace]
members = ["adapters/azure-devops", "agent-runtime", "safety-layer/core"]

[dependency-groups]
dev = [
    # anyio's pytest plugin runs the adapter's async tests; it arrives transitively through
    # httpx, but the suite would fail on an unknown marker if that ever changed.
    "anyio==4.12.0",
    "import-linter==2.15",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# Python only: markdown is linted by markdownlint, not by the Python lint check.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "PT", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: tests assert.
"**/tests/**" = ["S101"]
# S105/S106: these two files build a config with an obviously fake token. The rule stays on
# everywhere else, because it is the only automated check against a committed credential.
"adapters/azure-devops/tests/test_allowlist.py" = ["S101", "S106"]
"adapters/azure-devops/tests/test_reads.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
mypy_path = ["adapters/azure-devops/src", "agent-runtime/src", "safety-layer/core/src"]
files = [
    "tests",
    "adapters/azure-devops/src",
    "adapters/azure-devops/tests",
    "agent-runtime/src",
    "agent-runtime/tests",
    "safety-layer/core/src",
    "safety-layer/core/tests",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "adapters/azure-devops/tests",
    "agent-runtime/tests",
    "safety-layer/core/tests",
]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_packages = ["agent_runtime", "azure_devops", "safety_layer"]
include_external_packages = true

[[tool.importlinter.contracts]]
# Safety Layer invariant 1: decisions are deterministic code, never an LLM or a network call.
# Forbidden third-party packages here catch only a direct `import <name>` from our own
# source. import-linter (via grimp) puts each external package in the graph as one opaque
# node and does not parse its internal source, so a package a listed one depends on
# internally (e.g. claude-agent-sdk's own use of `mcp`) is not traced and is not caught here.
name = "The Safety Layer imports no agent SDK, LLM client, or HTTP client"
type = "forbidden"
source_modules = ["safety_layer"]
# Standard-library network modules are banned by ruff in safety-layer/core/ruff.toml.
forbidden_modules = [
    "agent_runtime",
    "aiohttp",
    "anthropic",
    "azure_devops",
    "claude_agent_sdk",
    "copilot",
    "httpcore",
    "httpx",
    "mcp",
    "openai",
    "requests",
    "urllib3",
]

[[tool.importlinter.contracts]]
# The adapter's allowlist is enforced in an httpx transport, so another HTTP client would
# reach Azure DevOps without passing it. `httpcore` is absent on purpose: httpx uses it.
# The adapter also makes no model calls; it translates requests and nothing more.
name = "The Azure DevOps adapter imports no other HTTP client, agent SDK, or LLM client"
type = "forbidden"
source_modules = ["azure_devops"]
forbidden_modules = [
    "agent_runtime",
    "aiohttp",
    "anthropic",
    "claude_agent_sdk",
    "copilot",
    "mcp",
    "openai",
    "requests",
    "urllib3",
]

[[tool.importlinter.contracts]]
# Only the Agent Runtime imports an agent SDK (ADR 0004): its backends configure the SDK so
# the model sees the Tool Surface and nothing else. It stays independent of what the tools
# do, so it imports no adapter and no Safety Layer code, and it makes no direct HTTP calls.
# `mcp` and `anthropic` are listed for the same reason as in the Safety Layer's contract
# above: they catch a direct import from this package's own source, not claude-agent-sdk's
# internal use of `mcp` (see the comment there) — the SDK confinement itself is structural
# (this is the only package allowed to import it), not from this forbidden-modules list.
name = "The Agent Runtime imports no adapter, Safety Layer code, or HTTP client"
type = "forbidden"
source_modules = ["agent_runtime"]
forbidden_modules = [
    "aiohttp",
    "anthropic",
    "azure_devops",
    "httpcore",
    "httpx",
    "mcp",
    "requests",
    "safety_layer",
    "urllib3",
]
