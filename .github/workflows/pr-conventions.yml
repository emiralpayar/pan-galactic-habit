name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: scripts/checks/branch-name.sh "$BRANCH"

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check PR title
        # The title becomes the squash commit on main, so it is checked for every author.
        # Dependabot titles are generated and can exceed the header length, so only that
        # rule is relaxed for them. A failing Dependabot title is fixed by editing the PR title.
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            scripts/checks/commit-message.sh --pr-title "$TITLE" --no-length-limit
          else
            scripts/checks/commit-message.sh --pr-title "$TITLE"
          fi

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            # Dependabot's commits can't be reworded without breaking its updates, and they are
            # squashed away; the PR title (the squash commit header) is checked instead.
            echo "::notice title=Commit messages not checked::Dependabot PR: commit messages are squashed; the PR title check covers the commit that lands on main."
            exit 0
          fi
          # A promotion from agent-main carries squash commits that each passed this
          # repository's PR title check when they landed on agent-main; GitHub's " (#NN)"
          # suffix can push them past the length limit (ADR 0010).
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "agent-main" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            echo "::notice title=Commit messages not checked::Promotion from agent-main: its commits were checked when they landed; the PR title check covers the commit that lands on main."
            exit 0
          fi
          # Commits already on main were checked when they landed there, so a sync from
          # main into agent-main checks only its own commits.
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA" ^origin/main); do
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            scripts/checks/commit-message.sh "$RUNNER_TEMP/message" || status=1
            echo "::endgroup::"
          done
          exit "$status"
