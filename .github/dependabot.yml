version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  # The first Python package adds a `uv` entry here (docs/adr/0003-use-python-as-the-implementation-language.md).
