version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # No scope: Dependabot would use `deps-dev` for dev dependencies, which is not an allowed scope.
    commit-message:
      prefix: build
    labels: [dependencies]
    groups:
      python:
        patterns: ["*"]
