version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  # Add an entry for the implementation language's package ecosystem once it is chosen (ARCHITECTURE.md §11).
